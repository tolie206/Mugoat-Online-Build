name: Diagnose native iOS link
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tolie206/Regeneration
          ref: a7df67c920130d987655138cc631562b3b2306f3
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Build iOS Rust library and report required native dependencies
        run: |
          rustup target add aarch64-apple-ios
          IPHONEOS_DEPLOYMENT_TARGET=16.0 cargo rustc --manifest-path source/network/native-port/online-bridge/Cargo.toml --release --lib --target aarch64-apple-ios -- --print native-static-libs
      - name: Install project generator
        run: brew install xcodegen
      - name: Probe real iOS link using minimal native host
        run: |
          mkdir -p source/app/Build/Online
          cp source/network/native-port/online-bridge/target/aarch64-apple-ios/release/libmugoat_online.a source/app/Build/Online/
          python3 source/tools/preflight_online_link.py
